name: Bug report
description: Something ccdad did that it should not have, or did not do that it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before anything else: never paste a token.**

        `ccdad` handles live OAuth refresh tokens and API keys. `ccdad doctor`
        exists partly for this — it prints the *names* of credential
        environment variables and never their values, and it reports file
        modes and paths rather than contents. Prefer its output to a hand-made
        description.

        If what you have found is a way to read someone else's credentials, do
        not open an issue: see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        I ran `ccdad switch work`, it printed "…", and Claude Code was still
        logged in as the old account afterwards.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: "`ccdad doctor --json` output"
      description: >-
        Paste the whole object. It is the single most useful thing in this
        form: it reports the store layout, the file modes, whether the daemon
        lock works on this filesystem, whether Claude Code's credential file is
        readable, and which credential environment variables are set — by name
        only.
      render: json
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "`ccdad --version`"
      description: >-
        The whole line, including the commit in parentheses. A build from
        `go install` reports a commit rather than a tag; that is expected and
        worth knowing about when reading a report.
      placeholder: ccdad version 0.1.0 (c24609320a6a)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Windows
        - WSL
    validations:
      required: true

  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: >-
        `claude --version`. ccdad reads and writes files that belong to Claude
        Code, and their layout is pinned against one observed release, so this
        is often the whole answer.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        A sequence someone else can run. If it needs more than one account,
        say so — that is not a barrier, it is information.
      placeholder: |
        1. ccdad add          (twice, two accounts)
        2. ccdad switch <uuid>
        3. …
    validations:
      required: false

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: >-
        A daemon log (`~/.ccdad/daemon.log`), a `--json` payload from another
        command, an unusual filesystem (NFS, CIFS, a network home directory),
        a non-default `CCDAD_HOME`, `CLAUDE_CONFIG_DIR` or
        `CLAUDE_SECURESTORAGE_CONFIG_DIR`.
    validations:
      required: false

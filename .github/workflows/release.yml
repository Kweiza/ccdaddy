# Publish a release: six bare binaries, a sums file, a minisign signature over
# that sums file, and a build-provenance attestation over all of them.
#
# Three claims, and they are independent rather than layered. sha256sums.txt
# says the bytes are intact; sha256sums.txt.minisig says those checksums were
# signed by this repository's release key, for the release its trusted comment
# names; the attestation says the binaries came out of this workflow. The
# signature is the one a human can check offline, with the stock minisign tool
# and the public key committed at the repository root as ccdaddy.pub.
#
# Nothing in a shipped ccdad consumes the signature yet, and it is published
# first on purpose: a verifier baked into a binary can only ever look at
# releases cut after it, so the signature has to exist before anything requires
# one.
#
# Nothing here publishes until .github/workflows/ci.yml has gone green on the
# tagged commit: see the gate job below.
name: release

on:
  push:
    tags:
      - "v*"

# Read-only by default; the one job that needs to write says so for itself.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A SEPARATE job, before the build, on purpose. A tag that is not strict
  # semver, or a repository still on the default read-only GITHUB_TOKEN, both
  # fail at `gh release create` - the very last step, after every build minute
  # is already spent.
  #
  # It answers two questions, cheapest first: is this tag publishable at all,
  # and did CI ever prove this commit green. The second can wait for a run that
  # is still in flight, so the first is deliberately the one that costs
  # seconds.
  gate:
    name: Gate the tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Reading another workflow's runs is the Actions API, which `contents:
    # read` does not cover.
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      # Only the workflow file and the two scripts are needed here, but a
      # sparse checkout for four seconds of work is not worth the branch.
      - uses: actions/checkout@v7

      # The rule itself lives in scripts/tag-gate.sh, where it has a test.
      # Inline in a `run:` block it would be the one piece of release logic
      # that could only be exercised by pushing a tag.
      - id: tag
        # Through the environment rather than interpolated into the shell
        # line: a tag name is repository input, and `${{ }}` inside `run:`
        # substitutes before bash ever sees it.
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/tag-gate.sh "$TAG" >>"$GITHUB_OUTPUT"

      # Until this existed, a tag on a commit whose CI never ran - or ran red -
      # published six binaries and an attestation anyway, because the only test
      # in this workflow is the ubuntu-only re-run below. The rule lives in
      # scripts/require-green-ci.sh, where it has a test that does not need a
      # tag to exercise it, and its header records why it asks the Actions API
      # for ci.yml's runs rather than for the commit's check runs.
      #
      # There is no override input. A red CI and a human in a hurry is the
      # combination this exists for.
      - name: Require a green CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/require-green-ci.sh "$GITHUB_SHA"

  publish:
    name: Build and publish
    needs: gate
    runs-on: ubuntu-latest
    # All three are needed and all three fail late: id-token and attestations
    # for the keyless signature, contents for the release itself.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The last gate before a public artifact, and the only one in this
      # workflow that runs the code. The three-OS matrix in .github/workflows/
      # ci.yml is what actually covers the platforms, and the gate job has
      # already refused this tag unless that matrix went green on this very
      # commit; this is the cheap re-run that catches a tree which builds but
      # whose release path does not.
      - name: Test
        # -race, not a bare test run. internal/daemon is the first package with
        # a lock held for process life, a spawned child and a background loop,
        # and the race detector has already caught one defect there that a
        # plain run passed.
        run: go test -race ./...

      # Go cross-compiles all six targets on one runner in about two minutes,
      # so there is no matrix here and therefore nothing for fail-fast to
      # apply to. Deliberately the same script a developer runs, so the asset
      # names cannot drift between the two.
      #
      # A `Vet every release target` step used to stand here, because nothing
      # else compiled a _windows.go file or its tests. The ci.yml `cgo` job now
      # does exactly that on every commit, and the gate above will not let this
      # job start on a commit where it did not pass, so repeating it here costs
      # a minute of every release and proves nothing new.
      - name: Build the release assets
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: scripts/build-release.sh

      # Between the build and the attestation, and both halves of that matter.
      # After the build because sha256sums.txt has to be final; before the
      # attestation because `subject-path: dist/*` then covers the signature
      # too. `gh release upload "$TAG" dist/*` picks the new file up unchanged.
      #
      # The signer is a package main in this repository rather than a
      # `minisign -S` line, and the reason is a flag: the stock tool signs
      # PREHASHED unless it is given -l, and a prehashed signature is one every
      # published ccdad refuses. Fixing the mode in internal/relsign removes the
      # command line the flag could be dropped from -- and removes the need for
      # minisign to be installed on this runner at all.
      #
      # It is not called from scripts/build-release.sh, so a developer can run
      # that script with no secret and get byte-identical output.
      #
      # There is no `if:` guard and no soft failure. A release that published
      # unsigned because a secret was missing would split the fleet in a way
      # that is only visible in users' update logs. A fork pushing a v* tag
      # without the secret gets a red publish job; that is stated and accepted.
      - name: Sign the checksums
        env:
          # Through the environment, never interpolated into the run: block --
          # the same rule the gate job states above for the tag name.
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ github.ref_name }}
        # -p is the key committed in this tree: the signer verifies what it just
        # produced against it, so a repository secret that is not the key ccdad
        # carries fails here rather than on every user's machine.
        run: go run ./scripts/minisign-sign -m dist/sha256sums.txt -t "$TAG" -o dist/sha256sums.txt.minisig -p ccdaddy.pub

      # Attest what is about to be uploaded, in this job, before uploading.
      # Attesting a rebuilt copy produces digests that `gh attestation verify`
      # then rejects, and the failure is only visible to whoever tries to
      # verify - never to the release that produced it.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      # `gh release create` errors on a tag that already has a release, so the
      # idempotent shape is create-if-missing followed by upload --clobber.
      # That is what makes a re-run of a failed publish a no-op rather than a
      # second failure.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=""
            if [ "$PRERELEASE" = true ]; then
              flags="--prerelease"
            fi
            # --verify-tag refuses to invent a tag if the ref went missing
            # between the push and this step.
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes $flags
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'

  # The one thing that proves the installers work, and it can only run once
  # something is published: nothing else here runs a PUBLISHED installer
  # against a PUBLISHED release on a real runner.
  # .github/workflows/install-smoke.yml is where it lives and where its
  # trade-offs are written down.
  #
  # Called as a job rather than left to `on: release: types: [published]` in
  # that file, for two reasons that each make the event useless here:
  #
  #   * The release above is created with the repository's GITHUB_TOKEN, and
  #     events triggered by that token do not start workflow runs. The workflow
  #     would never fire, and nothing would say so.
  #   * The event arrives at `gh release create`, which is the step BEFORE
  #     `gh release upload`. A run started by it would race the assets it is
  #     supposed to install.
  #
  # A red smoke does not un-publish anything - by here the tag is public - but
  # it is the difference between finding out from CI and finding out from a
  # user whose install one-liner did nothing.
  smoke:
    name: Post-release install smoke
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/install-smoke.yml
    with:
      tag: ${{ github.ref_name }}

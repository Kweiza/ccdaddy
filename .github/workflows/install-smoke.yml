# The only test that proves the installers work.
#
# Everything else about installing is checked against a release that does not
# exist: scripts/install_sh_test.go and scripts/install_ps1_test.go serve their
# own assets from a local HTTP server, which is the right way to pin the parsing
# and the fail-closed branches and can say nothing at all about the real thing.
# This workflow runs the PUBLISHED installer against a PUBLISHED release, on
# real runners, and asserts that the binary which lands answers for the version
# it claims to be. That combination — published script, published release, a
# real runner — exists nowhere else in this repository.
#
# ---------------------------------- why this is a reusable workflow and not
#                                    `on: release` alone
#
# `.github/workflows/release.yml` creates the release with the repository's
# GITHUB_TOKEN, and events triggered by that token do not start workflow runs.
# `on: release: types: [published]` would therefore NEVER fire for a release
# this repository publishes: the file would sit here looking correct and running
# never, which is worse than not having it at all. So release.yml calls this as
# a job.
#
# Being a job also removes a race the event has even where it does fire.
# `release published` arrives at `gh release create`, and release.yml uploads
# the assets in the step AFTER that one - so a smoke test started by the event
# races the upload and aborts on a sums file that is not there yet. With
# `needs: publish` the upload has already finished.
#
# `on: release` is kept for the one case the token rule does not cover: a
# release a HUMAN publishes through the web UI, which is not the token's doing
# and does fire. workflow_dispatch is how a finished release gets re-tested.
#
# ---------------------------------- which installer is under test
#
# The one at raw.githubusercontent.com/<repo>/main/install.sh: the documented
# one-liner, which is the artifact users actually execute. It is NOT
# the tagged copy, so a release cut from a commit whose installer differs from
# main is tested against a script that did not ship with it. That is the
# deliberate half of the trade: the failure worth being loud about is "the
# command in the README is broken today", and a red leg here means exactly that
# even when the published binaries are fine. Every leg prints the sha256 of the
# script it fetched, so a run records which bytes it ran.
#
# ---------------------------------- what a green run does not cover
#
# Two of the six published assets are never installed, and a checkmark will be
# read as an all-clear over all six unless it is said out loud - which the
# resolve job repeats as a run annotation, because the header is not what anyone
# reads once the checkmark is there:
#
#   ccdad-darwin-amd64   GitHub's macOS runners are arm64.
#   ccdad-windows-arm64  GitHub's Windows runners are amd64.
#
# Both reasons above are facts about the runner images on offer rather than
# choices, so neither entry is closable the way ccdad-linux-arm64 was: that one
# was the third on this list until a dispatch proved the `ubuntu-24.04-arm`
# label resolves for this repository, which is the only thing that was ever in
# doubt about it.
name: install-smoke

on:
  workflow_call:
    inputs:
      tag:
        description: The published tag to install, for example v1.2.3.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The published tag to install, for example v1.2.3.
        required: true
        type: string
      previous:
        description: >-
          Upgrade from this tag instead of the release before `tag`. Leave it
          empty for a real re-test. It exists because the upgrade leg's daemon
          assertion self-skips against a predecessor with no `daemon` command,
          and the only such predecessor is the one N-1 happens to resolve to
          today - so without an override that assertion cannot be exercised at
          all until another release is published. Setting it to `tag` itself is
          legitimate and is how the handover gets tested: install.sh has no
          "already at this version" shortcut, so it stops the running daemon and
          replaces the binary exactly as a real upgrade does.
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

# No concurrency group on purpose. Nothing here writes anything, runs for
# different tags are independent, and a run cancelled to make way for another
# proves nothing about either release.

# One place, because the alternative is remembering it per step: without an
# explicit shell, Actions runs `run:` blocks on Windows through PowerShell. The
# one step that WANTS PowerShell says so for itself.
defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.gate.outputs.version }}
      pin: ${{ steps.latest.outputs.pin }}
      previous: ${{ steps.previous.outputs.previous }}
    steps:
      # Three triggers, one answer: `inputs` is empty for the release event and
      # `github.event.release` is empty for the other two.
      - id: target
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag=${INPUT_TAG:-$RELEASE_TAG}
          if [ -z "$tag" ]; then
            echo "install-smoke: no tag to install" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >>"$GITHUB_OUTPUT"

      # The workflow's own commit, NOT the tag. What the scripts below are is
      # the smoke harness, not the thing being smoke-tested; checking out the
      # tag would make a dispatch against an old release run that release's
      # harness, and against a release that predates these scripts it would find
      # none at all. When release.yml calls this, the two are the same commit.
      - uses: actions/checkout@v7

      # The release's own rule rather than a second copy of it: this is the
      # script whose output release.yml passed to build-release.sh as VERSION,
      # so what is asserted here cannot drift from what was stamped there. It
      # also refuses a tag that is not strict semver, which is the right answer
      # for a dispatch with a typo in it.
      - id: gate
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: scripts/tag-gate.sh "$TAG" >>"$GITHUB_OUTPUT"

      # Does github.com/<repo>/releases/latest/download resolve to THIS tag?
      # Only then can a leg run the documented one-liner with nothing pinned,
      # which is the path every user takes and therefore the one worth
      # exercising. It does not resolve for a prerelease - release.yml marks
      # those, and marking is the whole mechanism that keeps them off the
      # default install - and it does not resolve at all on a repository whose
      # only releases are prereleases, where the endpoint is a 404. Asking is
      # cheaper than inferring and is right in all three cases.
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ "$latest" = "$TAG" ]; then
            echo "install-smoke: latest resolves to $TAG — the legs run the one-liner unpinned" >&2
            printf 'pin=\n' >>"$GITHUB_OUTPUT"
          else
            echo "install-smoke: latest is ${latest:-nothing}, not $TAG — the legs pin CCDAD_VERSION" >&2
            printf 'pin=%s\n' "$TAG" >>"$GITHUB_OUTPUT"
          fi

      # Empty on the first release, which turns the upgrade leg off rather than
      # failing it. scripts/previous-release.sh says why.
      #
      # The override is dispatch-only: `inputs` is empty for the release event,
      # and workflow_call does not declare it, so release.yml can never reach
      # this branch and a real release always asks the API.
      - id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          OVERRIDE: ${{ inputs.previous }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            echo "::notice title=The upgrade leg's predecessor was chosen by hand::This run upgrades from $OVERRIDE, not from whatever release precedes $TAG. It says nothing about which release a user actually upgrades from."
            printf 'previous=%s\n' "$OVERRIDE" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/previous-release.sh "$TAG" >>"$GITHUB_OUTPUT"

      - name: Say what this run does not cover
        run: |
          echo "::notice title=Install smoke covers four of six release assets::Installed here: ccdad-linux-amd64, ccdad-linux-arm64, ccdad-darwin-arm64, ccdad-windows-amd64. Never installed: ccdad-darwin-amd64 (GitHub's macOS runners are arm64), ccdad-windows-arm64 (its Windows runners are amd64)."

  # The one thing in this repository that can show the SIGNING pipeline works
  # end to end. internal/relsign's tests prove our signer and our verifier agree
  # with each other, which is exactly what a pair wrong in the same way also
  # does. Everything between them is untested until here: the secret in Actions,
  # the signer running in CI, the upload, the key committed in this tree, and a
  # stranger's minisign accepting the result. Without this job the first proof
  # of that chain is somebody's failed upgrade.
  signature:
    name: Verify the published signature
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The workflow's own commit, for ccdaddy.pub, for the reason the resolve
      # job gives above. The key that matters is the one THIS tree claims a
      # release is signed with; checking a release against a key taken from that
      # same release is a round trip that cannot fail.
      - uses: actions/checkout@v7

      # Unpacked, not installed: dpkg-deb -x needs no root and touches no dpkg
      # database, so this step cannot pass by changing the machine, and what it
      # produces is the distribution's own build rather than anything from here.
      - name: Fetch the stock minisign
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/minisign"
          cd "$RUNNER_TEMP/minisign"
          # The runner image's package index can be older than the pool it
          # points at, which surfaces as a 404 on the .deb rather than as a
          # missing package. One refresh, one retry; after that it is a real
          # failure and this job says so instead of skipping.
          apt-get download minisign || { sudo apt-get update && apt-get download minisign; }
          dpkg-deb -x minisign_*.deb root
          printf '%s\n' "$RUNNER_TEMP/minisign/root/usr/bin" >>"$GITHUB_PATH"

      # Printed, not asserted. WHICH build accepted the signature is the
      # evidence this job exists to produce, and a version in the log is what
      # makes a later "it verified" claim checkable by somebody else.
      - name: Say which minisign this is
        run: minisign -v

      - name: Download the published checksums and their signature
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rel"
          # Tag-pinned rather than latest/download: a prerelease does not
          # resolve there at all, and for anything else the two are the same
          # bytes. install.sh builds the same URL shape for the same reason.
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/rel/sha256sums.txt" "$base/sha256sums.txt"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/rel/sha256sums.txt.minisig" "$base/sha256sums.txt.minisig"

      - name: Verify with the key committed in this tree
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          rel=$RUNNER_TEMP/rel
          # The rule lives in the script, not in this block, because it is
          # subtle enough to deserve a test and a `run:` block cannot have one.
          # minisign answers "is this signature authentic"; the script adds "and
          # is it the release I asked for", which is the check that stops an
          # origin serving an older release's genuine, correctly signed pair.
          scripts/verify-release-signature.sh "$TAG" ccdaddy.pub "$rel/sha256sums.txt" "$rel/sha256sums.txt.minisig"

      # Two controls, because everything above has so far proved that minisign
      # ran. These prove it LOOKED, against the artifact this release actually
      # published rather than against a fixture. Without them a wrong flag -- a
      # message that is not the file downloaded, a key that is not the one
      # committed -- passes this job forever.
      - name: Prove the verification can fail
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          rel=$RUNNER_TEMP/rel
          ctl=$RUNNER_TEMP/ctl
          mkdir -p "$ctl"

          # One: the real signature over content it does not cover. If this
          # passes, nothing is binding the checksums to the signature.
          cp "$rel/sha256sums.txt" "$ctl/tampered.txt"
          printf 'tampered\n' >>"$ctl/tampered.txt"
          if scripts/verify-release-signature.sh "$TAG" ccdaddy.pub "$ctl/tampered.txt" "$rel/sha256sums.txt.minisig" >/dev/null 2>&1; then
            echo "install-smoke: a sums file with a line appended to it was accepted" >&2
            exit 1
          fi

          # Two: the real content and signature under a key that is not ours.
          # If this passes, the public key is not being consulted and the check
          # above would take anybody's signature. Generated here rather than
          # committed, so this control cannot be broken by tidying a fixture
          # directory somewhere else in the tree.
          minisign -G -W -p "$ctl/other.pub" -s "$ctl/other.key" >/dev/null
          if scripts/verify-release-signature.sh "$TAG" "$ctl/other.pub" "$rel/sha256sums.txt" "$rel/sha256sums.txt.minisig" >/dev/null 2>&1; then
            echo "install-smoke: our signature was accepted under a key that is not ours" >&2
            exit 1
          fi
          echo "install-smoke: both controls were refused, so the verification above was doing work" >&2

  fresh:
    name: fresh install (${{ matrix.os }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # The matrix is for tests, and the reason it is worth having: one leg
      # failing is information about that platform, and cancelling the rest
      # throws it away at exactly the moment it is most wanted.
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is here rather than named as a gap because a dispatch
        # proved the label resolves for this repository. That was the whole
        # blocker: a label GitHub does not recognise is a job that queues and
        # never starts, which would turn every future release's smoke red for a
        # reason that has nothing to do with the release.
        #
        # Nothing below branches on the label, and it does not need to. The
        # steps ask $RUNNER_OS, which is Linux for both Ubuntu legs, and the
        # thing actually under test - install.sh choosing an asset - reads
        # `uname -m`, so the arm leg is what makes it pick ccdad-linux-arm64.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Which bytes this run executed. main moves, so a run that goes red six
      # months from now is otherwise about a script nobody can identify.
      - name: Record the installer under test
        env:
          REPO: ${{ github.repository }}
        run: |
          name=install.sh
          if [ "$RUNNER_OS" = Windows ]; then
            name=install.ps1
          fi
          url=https://raw.githubusercontent.com/$REPO/main/$name
          curl -fsSL "$url" -o installer.copy
          echo "install-smoke: $url"
          sha256sum installer.copy 2>/dev/null || shasum -a 256 installer.copy

      # install.ps1's PATH write is the one thing in either installer that no
      # test can reach. scripts/install_ps1_test.go skips its whole driver on
      # Windows deliberately: Add-CcdadToUserPath appends to the real
      # HKCU\Environment, so `go test ./...` on a contributor's machine would
      # leave one t.TempDir() in their PATH per run, permanently, and broadcast
      # it into effect. This runner is disposable, so here it can run for real -
      # and here is the only place install.ps1's two PATH landmines are ever
      # executed. The
      # decision they guard, Get-CcdadUpdatedPath, is unit-tested off Windows;
      # the registry round-trip around it is not, and that is what these two
      # steps read. Inline rather than in a script with a test of its own,
      # because a test for it would be this workflow.
      - name: Record the user PATH before installing
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $kind = 'absent'
          $value = ''
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $false)
          if ($null -ne $key) {
            try {
              if ($key.GetValueNames() -contains 'Path') {
                $kind = [string]$key.GetValueKind('Path')
                # DoNotExpandEnvironmentNames, so a %VAR% entry is recorded as
                # itself rather than as today's expansion. That is the shape the
                # installer writes back in, and therefore the shape the
                # comparison afterwards has to be in.
                $value = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
              }
            } finally {
              $key.Close()
            }
          }
          # Through files and WriteAllText rather than $GITHUB_ENV: Windows
          # PowerShell 5.1 writes UTF-16 by default, which corrupts that file,
          # and a PATH is exactly the kind of value worth round-tripping byte
          # for byte.
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'user-path-kind.txt'), $kind)
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'user-path-value.txt'), $value)

      # The documented one-liner, and the pipe is load-bearing rather than
      # decorative:
      # `curl | bash` puts the script itself on stdin, which is the constraint
      # install.sh is written around, and a leg that saved it to a file first
      # would hand it a stdin it never has in real life. The repository is an
      # environment variable and not `${{ }}` inside the command for the reason
      # release.yml gives: `${{ }}` substitutes before bash sees the line.
      - name: Install
        if: runner.os != 'Windows'
        env:
          CCDAD_VERSION: ${{ needs.resolve.outputs.pin }}
          REPO: ${{ github.repository }}
        run: curl -fsSL "https://raw.githubusercontent.com/$REPO/main/install.sh" | bash

      - name: Install
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1, which is what a stock Windows has and what
        # install.ps1 is written for, down to the TLS 1.2 line and the
        # ASCII-only rule. `shell: pwsh` would test PowerShell 7 instead, which
        # is not what someone installing ccdad for the first time is running.
        shell: powershell
        env:
          CCDAD_VERSION: ${{ needs.resolve.outputs.pin }}
          REPO: ${{ github.repository }}
        run: irm "https://raw.githubusercontent.com/$env:REPO/main/install.ps1" | iex

      - name: Assert the version that landed
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          # Both installers' DEFAULT directories, deliberately: a leg that
          # pointed CCDAD_INSTALL_DIR somewhere convenient would stop testing
          # the location every user gets, and on the POSIX legs it would also
          # skip the PATH warning that location exists to produce.
          # $LOCALAPPDATA arrives from Windows with backslashes, which the msys
          # layer under Git Bash does not resolve consistently.
          if [ "$RUNNER_OS" = Windows ]; then
            bin=${LOCALAPPDATA//\\//}/Programs/ccdad/ccdad.exe
          else
            bin=$HOME/.local/bin/ccdad
          fi
          scripts/smoke-version.sh "$TAG" "$bin"

      # The command the installer's last line now points at, run against the
      # binary that was actually published. Nothing else checks that the pointer
      # resolves - and a pointer that does not is precisely why install.sh
      # stopped naming this command once before.
      #
      # It tolerates a release that predates the command, the way the upgrade
      # leg's `daemon status` probe does: until a tag carries setup-path, and
      # for any run that pins an older CCDAD_VERSION, Cobra answers `unknown
      # command` which the exit contract retags as the usage code 2. That is a
      # ::notice about coverage, not a failure of this release.
      #
      # --print is the only mode safe to run here, and that is the point of
      # asserting it: it must write NOTHING. The manifest around it is what
      # proves that, because "it printed something" would pass for an
      # implementation that also edited a startup file.
      - name: Assert `setup-path --print` against the published binary
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            installDir=${LOCALAPPDATA//\\//}/Programs/ccdad
            bin=$installDir/ccdad.exe
          else
            installDir=$HOME/.local/bin
            bin=$installDir/ccdad
          fi

          manifest() {
            for f in "$HOME"/.bashrc "$HOME"/.bash_profile "$HOME"/.bash_login \
              "$HOME"/.profile "$HOME"/.zshrc "$HOME"/.zshenv \
              "$HOME"/.config/zsh/.zshrc "$HOME"/.config/fish/config.fish; do
              if [ -e "$f" ]; then
                printf '%s %s\n' "$f" "$(cksum <"$f")"
              else
                printf '%s absent\n' "$f"
              fi
            done
          }
          before=$(manifest)

          code=0
          out=$("$bin" setup-path --print 2>/dev/null) || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::notice title=setup-path is not in this release::\`$bin setup-path --print\` exited $code, so this release does not carry the command install.sh points at. Every other step in this leg ran."
            exit 0
          fi

          # Compared with both sides in forward slashes, because the two sides
          # disagree about separators and neither is wrong. $installDir was
          # built by rewriting $LOCALAPPDATA's backslashes, which is what the
          # steps around it need in order to hand a path to Git Bash. What
          # `setup-path --print` emits is filepath.Dir(os.Executable()), and on
          # Windows filepath.Clean ends in FromSlash - so it is ALWAYS
          # backslashed no matter how the binary was invoked. A raw substring
          # test therefore cannot match on Windows, ever.
          #
          # It went unnoticed because it could not run: every release before
          # v0.2.0 predates the command, so this step took the `exited $code`
          # tolerance above and never reached the comparison. This release is
          # the first one that gets here.
          case ${out//\\//} in
          *"$installDir"*) ;;
          *)
            echo "$out"
            echo "setup-path --print did not name the install directory $installDir, so the block it hands over registers the wrong path" >&2
            exit 1
            ;;
          esac

          after=$(manifest)
          if [ "$before" != "$after" ]; then
            diff <(printf '%s\n' "$before") <(printf '%s\n' "$after") || true
            echo "setup-path --print edited a startup file; --print is the mode that writes nothing" >&2
            exit 1
          fi
          echo "install-smoke: setup-path --print named $installDir and touched no startup file"

      # --print must leave the registry alone too, and on Windows that is the
      # half the manifest above cannot see.
      - name: Assert `setup-path --print` wrote no registry entry
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\ccdad'
          $bin = Join-Path $installDir 'ccdad.exe'

          function Read-UserPath {
            $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $false)
            if ($null -eq $key) { return '' }
            try {
              if (-not ($key.GetValueNames() -contains 'Path')) { return '' }
              return [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            } finally { $key.Close() }
          }
          $before = Read-UserPath

          # The tolerance below has to be reached before it can tolerate
          # anything, and in its first form it never was. An Actions
          # `shell: powershell` step runs under $ErrorActionPreference = 'Stop',
          # and under Stop a native command whose stderr is merged into the
          # pipeline raises a TERMINATING NativeCommandError - so a release
          # without the command killed this script on the invocation line,
          # before $LASTEXITCODE was ever read, and took the PATH-write
          # assertion after it down as a skip. That is the single highest-value
          # thing this leg does, and no run had executed it.
          #
          # The bash twin of this tolerance is written `2>/dev/null || code=$?`
          # and is fine, because a shell does not turn stderr into an
          # exception. The asymmetry is the whole reason this survived review,
          # and it is why the preference is dropped for exactly one line rather
          # than for the step: everything after it should still fail loudly.
          $eap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & $bin setup-path --print > $null 2>&1
          $code = $LASTEXITCODE
          $ErrorActionPreference = $eap
          if ($code -ne 0) {
            Write-Host "::notice title=setup-path is not in this release::'$bin setup-path --print' exited $code, so the registry half of this assertion did not run."
            exit 0
          }

          $after = Read-UserPath
          if ($after -cne $before) {
            throw "setup-path --print changed HKCU\Environment\Path; --print is the mode that writes nothing"
          }
          Write-Host "install-smoke: setup-path --print left the user PATH untouched"

      - name: Assert the installer's PATH write
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\ccdad'
          $kindBefore = [System.IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'user-path-kind.txt'))
          $valueBefore = [System.IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'user-path-value.txt'))

          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $false)
          if ($null -eq $key) { throw 'HKCU\Environment could not be opened for reading' }
          try {
            if (-not ($key.GetValueNames() -contains 'Path')) {
              throw 'the installer left no Path value in HKCU\Environment'
            }
            $kindAfter = [string]$key.GetValueKind('Path')
            $valueAfter = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          } finally {
            $key.Close()
          }

          function Split-PathValue([string]$v) {
            if ([string]::IsNullOrEmpty($v)) { return @() }
            return @($v.Split(';') | Where-Object { $_ -ne '' })
          }
          $before = Split-PathValue $valueBefore
          $after = Split-PathValue $valueAfter

          # Landmine 2: [Environment]::SetEnvironmentVariable writes REG_SZ, and
          # writing that over a REG_EXPAND_SZ value silently destroys %VAR%
          # expansion for every entry in it - including entries that have
          # nothing to do with ccdad.
          if ($kindBefore -ne 'absent' -and $kindAfter -cne $kindBefore) {
            throw "HKCU\Environment\Path was $kindBefore and is now $kindAfter - every %VAR% entry in it just stopped expanding"
          }

          # Landmine 1: $env:Path is Machine+User concatenated, so reading it
          # and writing it back to User scope duplicates the entire machine PATH
          # into the user's, permanently, and the next installer to do the same
          # doubles it again. Asked as "what appeared" rather than by looking
          # for one known machine entry, so any shape of it is caught. This is
          # deliberately not a recomputation of Get-CcdadUpdatedPath: a
          # recomputation would agree with the installer about a wrong answer.
          $added = @($after | Where-Object { $before -notcontains $_ })
          if ($added.Count -eq 0) {
            throw "the installer added nothing to the user PATH, so $installDir is not on it"
          }
          if ($added.Count -gt 1) {
            throw "the installer added $($added.Count) entries to the user PATH, want only ${installDir}: $($added -join ', ')"
          }
          if (-not [string]::Equals($added[0].TrimEnd('\'), $installDir.TrimEnd('\'), [StringComparison]::OrdinalIgnoreCase)) {
            throw "the installer added '$($added[0])' to the user PATH, want '$installDir'"
          }
          $lost = @($before | Where-Object { $after -notcontains $_ })
          if ($lost.Count -ne 0) {
            throw "the installer dropped these entries from the user PATH: $($lost -join ', ')"
          }

          # The ownership record, which is what makes `ccdad uninstall` safe on
          # Windows: a registry PATH component carries no evidence of who added
          # it, so removal is gated on this value rather than on the directory's
          # contents. Without it the installer's entry is one uninstall can
          # never prove is ccdad's, and it stays on the user's PATH forever.
          $record = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Software\ccdad', $false)
          if ($null -eq $record) { throw 'the installer left no HKCU\Software\ccdad key, so uninstall cannot prove the PATH entry is ccdad''s' }
          try {
            $entry = [string]$record.GetValue('PathEntry', '')
          } finally {
            $record.Close()
          }
          if (-not [string]::Equals($entry.TrimEnd('\'), $installDir.TrimEnd('\'), [StringComparison]::OrdinalIgnoreCase)) {
            throw "HKCU\Software\ccdad\PathEntry is '$entry', want '$installDir'"
          }

          Write-Host "install-smoke: the user PATH gained $installDir and nothing else, still $kindAfter, recorded as ccdad's"

  # One leg, on the cheapest runner. What it adds over the three above is
  # install.sh stopping the daemon before replacing the binary, which clauth
  # does not need because launchd owns its process and ccdad does because its
  # daemon is self-managed and holds a singleton lock.
  #
  # install.ps1's upgrade path is not covered HERE, and the part of it that only
  # Windows can answer no longer needs a leg: Install-CcdadBinary was split out
  # of Invoke-CcdadInstall so that scripts/install_ps1_windows_test.go can call
  # it against a REAL running image on ci.yml's windows-latest leg, where the
  # plain overwrite is asserted to be refused before the rename-aside is asked
  # to succeed. What a second upgrade leg would add over that is the published
  # installer replacing a published release on a machine nobody prepared, which
  # is the same argument the fresh Windows leg above makes for itself -- worth
  # having, and a runner-cost decision rather than a gap.
  upgrade:
    name: upgrade over ${{ needs.resolve.outputs.previous }}
    needs: resolve
    # The first release has nothing to upgrade from.
    if: needs.resolve.outputs.previous != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Record the installer under test
        env:
          REPO: ${{ github.repository }}
        run: |
          url=https://raw.githubusercontent.com/$REPO/main/install.sh
          curl -fsSL "$url" -o installer.copy
          echo "install-smoke: $url"
          sha256sum installer.copy

      - name: Install the previous release
        env:
          CCDAD_VERSION: ${{ needs.resolve.outputs.previous }}
          REPO: ${{ github.repository }}
        run: curl -fsSL "https://raw.githubusercontent.com/$REPO/main/install.sh" | bash

      # Also the only exercise CCDAD_VERSION gets: the fresh legs run unpinned
      # whenever `latest` lets them.
      - name: Assert the previous release landed
        env:
          PREV: ${{ needs.resolve.outputs.previous }}
        run: scripts/smoke-version.sh "$PREV" "$HOME/.local/bin/ccdad"

      - name: Start a daemon for the upgrade to strand
        env:
          PREV: ${{ needs.resolve.outputs.previous }}
        run: |
          ccdad=$HOME/.local/bin/ccdad

          # The previous release may predate the daemon command group -
          # v0.1.0-rc1 does, v0.1.0 does not - and install.sh already
          # contemplates exactly that:
          # it treats a non-zero `daemon stop` as "nothing to stop" rather than
          # aborting the upgrade. Asking is safe because `daemon status` is a
          # probe and is deliberately off the auto-start allow-list, so it never
          # starts what it is probing. 0 is running and 5 is not running;
          # anything else is a binary with no such command, where 2 is Cobra's
          # unknown subcommand retagged as a usage error.
          code=0
          "$ccdad" daemon status >/dev/null 2>&1 || code=$?
          case $code in
          0 | 5) ;;
          *)
            echo "::notice title=Upgrade leg could not test the daemon handover::$PREV has no 'daemon' command (exit $code), so the assertion that an upgrade stops the old daemon did not run in this release's smoke test. Every other step in this leg did."
            echo "OLD_DAEMON_PID=" >>"$GITHUB_ENV"
            exit 0
            ;;
          esac

          "$ccdad" daemon start
          # `daemon start` waits for the SINGLETON, and the status document is
          # published a moment after that lock is taken - so the pid can be
          # missing for a poll or two on a daemon that is already up.
          pid=
          for _ in $(seq 1 40); do
            pid=$("$ccdad" daemon status --json | jq -r '.daemon.pid // empty')
            [ -z "$pid" ] || break
            sleep 0.25
          done
          case $pid in
          '' | *[!0-9]*)
            echo "install-smoke: no pid in 'ccdad daemon status --json' after starting a daemon" >&2
            "$ccdad" daemon status --json >&2 || true
            exit 1
            ;;
          esac
          kill -0 "$pid"
          echo "install-smoke: the daemon to strand is pid $pid"
          echo "OLD_DAEMON_PID=$pid" >>"$GITHUB_ENV"

      - name: Install this release over it
        env:
          CCDAD_VERSION: ${{ needs.resolve.outputs.pin }}
          REPO: ${{ github.repository }}
        run: curl -fsSL "https://raw.githubusercontent.com/$REPO/main/install.sh" | bash

      - name: Assert the new version replaced it
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: scripts/smoke-version.sh "$TAG" "$HOME/.local/bin/ccdad"

      # Without this the leg proves nothing the fresh legs do not: the binary
      # would be new, the version would be right, and the old daemon would still
      # be running old code against the same accounts.
      - name: Assert the old daemon went with it
        run: |
          ccdad=$HOME/.local/bin/ccdad

          if [ -n "${OLD_DAEMON_PID:-}" ]; then
            # install.sh runs the OLD binary's `daemon stop`, which polls the
            # singleton rather than returning the moment it asks - so the
            # process should already be gone. Polled anyway: "the lock was
            # released" and "the process exited" are microseconds apart, and a
            # bare check would be flaky about which one it caught.
            gone=
            for _ in $(seq 1 40); do
              if ! kill -0 "$OLD_DAEMON_PID" 2>/dev/null; then
                gone=yes
                break
              fi
              sleep 0.25
            done
            if [ -z "$gone" ]; then
              echo "install-smoke: pid $OLD_DAEMON_PID survived the upgrade — the old daemon is running old code" >&2
              exit 1
            fi
            echo "install-smoke: pid $OLD_DAEMON_PID went with the upgrade"
          fi

          # And nothing holds the singleton now. 5 is a definite "not running",
          # which is the whole reason it is not 1: 1 would also be returned by a
          # daemon that is up and a lock that cannot be read.
          code=0
          "$ccdad" daemon status || code=$?
          if [ "$code" -ne 5 ]; then
            echo "install-smoke: 'ccdad daemon status' exited $code after the upgrade, want 5 (not running)" >&2
            exit 1
          fi

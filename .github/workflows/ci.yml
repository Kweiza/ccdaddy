# The gate every commit passes before a tag can publish it.
#
# Four jobs, and each one exists because something in this repository is
# otherwise compiled by nothing, run by nobody, or readable by no one outside
# this machine:
#
#   check   gofmt and `go vet` for the host, plus the check that no comment
#           points at a document this repository does not contain — the
#           comments cited an unpublished design document by section number
#           for a while, and every one of those citations resolved for exactly
#           one person.
#   test    `go test ./... -race` on all three operating systems. Until this
#           existed, `internal/winerr/winerr_windows.go` and every other
#           _windows.go file in the tree had never been compiled, let alone
#           run: `GOOS=windows go build ./...` passing on a developer's Linux
#           box is luck, not a gate, and it does not touch _test.go at all.
#   cgo     no target may need CGO: all six cross-compile with CGO_ENABLED=0,
#           and this job fails if that stops being true.
#   plugin  the Claude Code plugin manifests, checked by the tool that owns
#           their schema and then installed into a throwaway config directory,
#           so that the server they declare is proven to have been FOUND. A
#           schema written in this repository would be this repository's belief
#           about somebody else's schema, and it would drift with nothing to say
#           so. The claude version is pinned: an unpinned install takes whatever
#           is newest, and a warning added in any release would then fail the
#           release gate on a commit that changed nothing.
#
# `cites` rides in the `check` job rather than taking a runner of its own: it is
# a `git grep` and wants no toolchain, so a fourth job would spend a whole
# runner's startup on a question that takes milliseconds.
#
# The checks themselves live in scripts/ci.sh, one subcommand per job, so that
# a developer can run the same thing before pushing and get the same answer.
# `.github/workflows/release.yml` refuses to publish a tag whose commit has no
# successful run of THIS workflow.
name: ci

on:
  # Every branch, not just main. Work in this repository lands from a worktree
  # branch straight onto main rather than through a pull request, so "on: push
  # to main" would mean nothing was ever checked until after it landed — and
  # the release gate would have no run to read for any commit that was tagged
  # before main caught up.
  #
  # `pull_request:` is here for FORKS ONLY, and the `if:` on every job below is
  # what makes that true. The problem it solves and the two ways of solving it
  # wrong are worth writing down, because the repository now invites outside
  # contributions and a contributor whose pull request runs nothing would find
  # that out only after it landed:
  #
  #   * A fork's commits never reach this repository, so no `push` run exists
  #     for them. Without a `pull_request:` trigger an outside contribution is
  #     checked by nobody.
  #   * A same-repository branch fires BOTH triggers on one commit, which would
  #     run every matrix leg twice. Skipping the push run instead — through a
  #     shared concurrency group — is the tempting fix and it is the wrong one:
  #     the superseded run ends `cancelled`, and the release gate reads a
  #     cancelled run as "this commit was never green".
  #
  # So the guard runs the pull_request event only when the head is somewhere
  # else. Same-repository work keeps exactly the push run it has always had,
  # forks get exactly one run, and nothing this workflow does can cancel a run
  # the release gate is going to read.
  #
  # workflow_dispatch takes a ref of any kind, a tag included, which is the
  # supported way to get a run onto a commit that never had one. It is not an
  # override: the dispatched run still has to go green for the release gate to
  # pass.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never on main. A superseded run is a run that ends `cancelled`, and the
  # release gate reads a cancelled run as "this commit was never green" — so
  # cancelling main's runs would make every commit but the tip untaggable.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# One place, because the alternative is remembering it per step: without an
# explicit shell, Actions runs `run:` blocks on Windows through PowerShell,
# where `./...` is mangled before go ever sees it.
defaults:
  run:
    shell: bash

jobs:
  check:
    name: gofmt and vet
    # See the `pull_request:` note above: a same-repository pull request is
    # already covered by its push run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/ci.sh fmt vet cites

  test:
    name: test (${{ matrix.os }})
    # See the `pull_request:` note above: a same-repository pull request is
    # already covered by its push run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # The OS matrix is for tests, and the reason it is worth having: one OS
      # failing is information about that OS, and cancelling the other two
      # throws it away at exactly the moment it is most wanted.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # fish, so that the one shell dialect no development machine here can
      # execute is executed somewhere. `ccdad setup-path` writes fish syntax
      # into config.fish, and POSIX `export PATH=...` in that file is an error
      # fish prints on EVERY shell start forever - strictly worse than not
      # being on PATH - so the block's syntax is worth more than an assertion
      # about its text. Linux only: one real run is what was missing, and
      # brew-installing fish on the macOS runner buys a second copy of the same
      # answer for minutes of build time.
      - name: Install fish
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish
          fish --version

      # -race needs cgo and therefore a C compiler. All three runner images
      # ship one (gcc on ubuntu, clang from the Command Line Tools on macOS,
      # mingw-w64 on windows); if a future image drops it, this job fails
      # loudly with "-race requires cgo" rather than quietly testing less.
      #
      # CCDAD_REQUIRE_FISH turns the fish test's skip into a failure on the leg
      # that just installed fish. Without it the step above could stop working -
      # a renamed package, an image change - and the suite would go back to
      # skipping while still reporting green, which is the failure mode a
      # t.Skip always has.
      - run: scripts/ci.sh test
        env:
          CCDAD_REQUIRE_FISH: ${{ runner.os == 'Linux' && '1' || '' }}

  cgo:
    name: six targets without cgo
    # See the `pull_request:` note above: a same-repository pull request is
    # already covered by its push run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/ci.sh cgo

  plugin:
    name: plugin manifests
    # See the `pull_request:` note above: a same-repository pull request is
    # already covered by its push run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No setup-go on purpose: this job needs no toolchain, and giving it one
      # invites it to grow a build. Whether `ccdad mcp` speaks the protocol is
      # proven by the test job, on three operating systems.
      #
      # The version is a literal and never `stable` or `latest` - the installer
      # validates its positional argument against a semver-or-channel pattern
      # and exits 1 otherwise. It is the release the manifests in this
      # repository were measured against, one broken manifest at a time, so
      # that what this job enforces and what somebody checked are the same
      # thing. Bumping it is its own commit, so that a new validator rule is
      # attributable and one `git revert` undoes it. If upstream stops serving
      # this version, bump the pin - never disable the job and never add
      # continue-on-error, because a gate that can be switched off under time
      # pressure is a gate that is off.
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.243
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version
      # CCDAD_REQUIRE_CLAUDE turns the check's skip into a failure on the leg
      # that just installed claude. Without it the step above could stop working
      # and the check would go back to validating nothing while reporting green.
      #
      # No continue-on-error, ever: the run would still conclude `success` and
      # the release gate reads that conclusion, so the job would un-gate itself.
      - run: scripts/ci.sh plugin
        env:
          CCDAD_REQUIRE_CLAUDE: 1
